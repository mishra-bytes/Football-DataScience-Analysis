# Book config lives at the repo root, not in tome/, because Quarto cannot
# reliably reference chapters above its project directory, and it requires the
# home page to be `index.qmd` at the project root. Output lands in tome/_book.
project:
  type: book
  output-dir: tome/_book
  render:
    - index.qmd
    - labs/01-who-is-the-best-footballer.ipynb
    - labs/02-how-far-ahead-is-the-best.ipynb
    - labs/03-method-requirements-and-gates.ipynb
    - labs/04-method-league-strength.ipynb
    - tome/method-template.qmd

book:
  title: "gambeta"
  subtitle: "Football, statistics, and the argument that never ends"
  author: "Aditya Mishra"
  search: true
  chapters:
    - index.qmd
    - part: "The investigation"
      chapters:
        - labs/01-who-is-the-best-footballer.ipynb
        - labs/02-how-far-ahead-is-the-best.ipynb
    - part: "Methods"
      chapters:
        - labs/03-method-requirements-and-gates.ipynb
        - labs/04-method-league-strength.ipynb
        - tome/method-template.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    code-fold: show
    code-tools: true
    toc: true
    fig-align: center

execute:
  freeze: auto
  warning: false
