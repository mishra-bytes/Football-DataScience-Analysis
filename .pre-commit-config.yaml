repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # nbstripout deliberately absent. The notebooks are the blog, so they are
  # committed with their outputs and render on GitHub without being run. See
  # DECISION.md. Measured cost: 623 KB across thirteen chapters, six images.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]  # data/sample must stay under 5 MB (spec 3.4)
