[project]
name = "gambeta"
version = "0.1.0"
description = "Football analysis toolkit: era-normalized player ratings"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "soccerdata>=1.9.1",
    "pandera>=0.20",
    "matplotlib>=3.8",
    "requests>=2.32",  # Wikidata SPARQL; soccerdata already pulls it in
]

[project.optional-dependencies]
# [ctk] pulls the CUDA toolkit headers CuPy needs to JIT-compile kernels;
# without them cupy.random raises at runtime even though allocation works.
gpu = ["cupy-cuda12x[ctk]>=13"]
bayes = ["pymc>=5.16", "nutpie>=0.13", "arviz>=0.18"]

[project.scripts]
gambeta = "gambeta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "dvc>=3.55",
    "nbstripout>=0.7",
]
docs = ["quartodoc>=0.7", "jupyter>=1.1", "nbformat>=5.10"]
app = ["streamlit>=1.38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gambeta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD"]
ignore = ["PD901"]  # `df` is a fine name in this codebase

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gambeta"]

[[tool.mypy.overrides]]
module = ["soccerdata.*", "pandera.*", "matplotlib.*", "cupy.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gambeta --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["gambeta/cli.py"]
