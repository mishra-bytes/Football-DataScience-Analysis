[project]
name = "gambeta"
version = "0.1.0"
description = "Football analysis toolkit: era-normalized player ratings"
# Raised from 3.11: arviz>=1.0 (see the bayes extra below) only supports
# 3.12+, and the dev environment already assumed 3.12 (mypy, .python-version).
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "soccerdata>=1.9.1",
    "pandera>=0.20",
    "matplotlib>=3.8",
    "requests>=2.32",  # Wikidata SPARQL; soccerdata already pulls it in
]

[project.optional-dependencies]
# [ctk] pulls the CUDA toolkit headers CuPy needs to JIT-compile kernels;
# without them cupy.random raises at runtime even though allocation works.
gpu = ["cupy-cuda12x[ctk]>=13"]
# Unconstrained, the resolver reaches for numba 0.63.0b1, a pre-release whose
# np.row_stack() call breaks against current numpy (np.row_stack was removed).
# Floored above it at the newest stable line pytensor's own numba backend
# allows (numba<=0.66.0).
# arviz floored at 1.0: bayes.py's player_effects() uses the 1.x API
# (az.hdi's `prob=` kwarg and the `ci_bound` coordinate). Unconstrained, the
# resolver on python 3.11 picks 0.23, which predates both and breaks it.
bayes = ["pymc>=5.16", "nutpie>=0.13", "arviz>=1.0", "numba>=0.65,<=0.66"]

[project.scripts]
gambeta = "gambeta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",  # mypy --strict cannot type pandas without these
    "pre-commit>=3.8",
    "dvc>=3.55",
    "nbstripout>=0.7",
]
# griffe unconstrained lets the resolver reach for 2.x, whose numpydoc parser
# dropped the `allow_section_blank_line` kwarg quartodoc 0.11.1 still passes,
# crashing `quartodoc build` outright. Floored below it, same pattern as the
# numba pin on the bayes extra above.
docs = ["quartodoc>=0.7", "griffe<2.0", "jupyter>=1.1", "nbformat>=5.10"]
app = ["streamlit>=1.38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gambeta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
# These embed notebook source as string literals; the line budget applies to
# the generated notebook cells, not to this file.
"scripts/make_notebooks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gambeta"]

[[tool.mypy.overrides]]
module = ["soccerdata.*", "pandera.*", "matplotlib.*", "cupy.*", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymc, arviz and pytensor ship no stubs. Same pattern as the override above,
# scoped to the bayes extra only.
module = ["pymc.*", "arviz.*", "pytensor.*", "nutpie.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gambeta --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # CuPy warns when no system CUDA toolkit is present; the [ctk] extra supplies
    # the headers it needs, so the warning is noise here.
    "ignore:CUDA path could not be detected:UserWarning",
]

[tool.coverage.run]
omit = ["gambeta/cli.py"]
